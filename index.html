<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vnesite nekaj svojih številk in v dveh minutah dobite razčlenjen izračun letnih skritih stroškov sedanjega načina dela."
    />
    <title>Koliko vas stane sedanji način dela? — Datalab</title>
    <script>
      // Tema se postavi še pred izrisom, sicer bi ob nalaganju bliskala napačna
      // različica, preden se React zažene. Logika mora ostati enaka kot v
      // lib/theme.ts (readStoredTheme): shranjena ročna izbira ima prednost,
      // sicer odloči sistemska nastavitev.
      try {
        var stored = localStorage.getItem('datalab-kalkulator-tema');
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {
        /* zasebno brskanje ali blokiran localStorage — ostane privzeta svetla tema */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
