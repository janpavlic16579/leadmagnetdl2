name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Karta vprašalnika nastane iz konfiguracije ob vsaki objavi, zato ne more zastarati
      # in je ni v gitu. Mora biti zgrajena PRED `npm run build`, ker Vite v `dist`
      # prekopira `public/` — kar takrat še ne obstaja, ne bo objavljeno.
      # `tsx` gre prek npx namenoma: orodje ne posega v odvisnosti aplikacije.
      - name: Zgradi karto vprašalnika
        run: |
          npx --yes tsx tools/karta-vprasalnika/extract.ts
          node tools/karta-vprasalnika/build-diagram.mjs public/karta/index.html
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
