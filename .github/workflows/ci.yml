# Vratar pred združitvijo. Obstaja zato, ker je deploy.yml tekel šele PO potisku na
# main in poganjal samo `npm run build` — manjkajoč uvoz v pdf.ts se je zato pokazal
# šele ob objavi, ko je bilo prepozno. Isti ukazi kot lokalno, brez izjem.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nova objava na isti veji prekine prejšnjo — zadnje stanje je edino, ki šteje.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preveri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      # Ločeno od builda in PRED testi: vitest ne tipizira, zato je to edini korak,
      # ki ujame napako tipov. Prav ta razred napake je bil povod za ta workflow.
      - name: Preverjanje tipov
        run: npm run typecheck

      - name: Testi
        run: npm test

      # Karta vprašalnika je del objavne poti (glej deploy.yml) — če se orodje pokvari,
      # naj to pove PR in ne deploy.
      - name: Zgradi karto vprašalnika
        run: |
          npx --yes tsx tools/karta-vprasalnika/extract.ts
          node tools/karta-vprasalnika/build-diagram.mjs public/karta/index.html

      - name: Build
        run: npm run build
